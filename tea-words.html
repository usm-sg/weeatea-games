<script>
/* Tea Games photo sprites — shared by every game and by the Photo Studio.
   Reads 12 photo slots from this browser (IndexedDB), or from a teapack.json file
   placed next to the games (use that one when bundling the games into a store app).
   Any slot with no photo falls back to the normal emoji, so the games never break. */
(function(){
  var DB = 'tea-sprites', STORE = 'pack', N = 12;
  var imgs = {}, maps = {}, cbs = [], isReady = false;
  var S = window.TeaSprites = {
    N: N,
    ready: false,
    map: function(o){ for(var k in o) maps[k] = o[k]; },
    img: function(slot){ return imgs[slot] || null; },
    forEmoji: function(e){ var i = maps[e]; return (i == null) ? null : (imgs[i] || null); },
    onReady: function(cb){ if(isReady) cb(); else cbs.push(cb); }
  };
  function done(){ isReady = true; S.ready = true; var a = cbs; cbs = []; a.forEach(function(f){ try{ f(); }catch(e){} }); }

  function openDB(){
    return new Promise(function(res, rej){
      if(!window.indexedDB) return rej(new Error('no idb'));
      var r = indexedDB.open(DB, 1);
      r.onupgradeneeded = function(){ r.result.createObjectStore(STORE, { keyPath: 'id' }); };
      r.onsuccess = function(){ res(r.result); };
      r.onerror = function(){ rej(r.error); };
    });
  }
  function readAll(){
    return openDB().then(function(db){
      return new Promise(function(res, rej){
        var q = db.transaction(STORE).objectStore(STORE).getAll();
        q.onsuccess = function(){ res(q.result || []); };
        q.onerror = function(){ rej(q.error); };
      });
    });
  }
  function fromPack(){
    /* optional bundled file; the service worker keeps a copy so it also works offline */
    return fetch('teapack.json').then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){ return (j && j.slots) ? j.slots.map(function(s){ return { id: s.id, data: s.data }; }) : []; })
      .catch(function(){ return []; });
  }
  function load(item){
    return new Promise(function(res){
      if(!item || !item.data) return res();
      var im = new Image();
      im.onload = function(){ imgs[item.id] = im; res(); };
      im.onerror = function(){ res(); };
      im.src = item.data;
    });
  }
  Promise.all([ readAll().catch(function(){ return []; }), fromPack() ]).then(function(r){
    var byId = {};
    r[1].forEach(function(x){ byId[x.id] = x; });   /* bundled pack first … */
    r[0].forEach(function(x){ byId[x.id] = x; });   /* … the player's own photos win */
    return Promise.all(Object.keys(byId).map(function(k){ return load(byId[k]); }));
  }).then(done, done);
})();

</script>

//@@/WORDS@@
(function(){
  const $ = id=>document.getElementById(id);
  const ROWS = 6, COLS = 5;
  const ANS = Object.keys(ANSWERS);
  /* ---------- daily word: same for everyone on the same calendar day (device's local date) ---------- */
  function mulberry(a){ return function(){ a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a>>>15, 1 | a); t = t + Math.imul(t ^ t>>>7, 61 | t) ^ t; return ((t ^ t>>>14) >>> 0) / 4294967296; }; }
  const ORDER = (()=>{ const a = ANS.slice(), r = mulberry(20260101); for(let i=a.length-1;i>0;i--){ const j = Math.floor(r()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; })();
  const dayNo = d=>Math.floor((Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()) - Date.UTC(2026,0,1))/86400000);
  const today = new Date(), dayN = dayNo(today);
  const dateStr = today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
  const dailyWord = ()=>ORDER[((dayN % ORDER.length)+ORDER.length) % ORDER.length];

  const LS = { get(k,d){ try{ const v = localStorage.getItem(k); return v==null?d:JSON.parse(v); }catch(e){ return d; } }, set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){} } };
  let stats = LS.get('tw_stats', {played:0,won:0,streak:0,max:0,dist:[0,0,0,0,0,0],last:''});
  let mode = LS.get('tw_mode','daily');
  let answer, guesses, cur, done, won, busy = false;

  function newRound(){
    if(mode==='daily'){
      answer = dailyWord(); const sv = LS.get('tw_daily', null);
      if(sv && sv.date===dateStr){ guesses = sv.guesses; done = sv.done; won = sv.won; } else { guesses = []; done = false; won = false; }
    } else { answer = ANS[Math.floor(Math.random()*ANS.length)]; guesses = []; done = false; won = false; }
    cur = ''; buildGrid(); paintAll(); $('modeBtn').textContent = mode==='daily' ? '📅' : '🎲';
    $('hint').textContent = mode==='daily' ? 'Daily puzzle' : 'Practice — random word';
  }
  function save(){ if(mode==='daily') LS.set('tw_daily',{date:dateStr,guesses,done,won}); }

  /* ---------- grid + keyboard ---------- */
  function buildGrid(){
    const g = $('grid'); g.innerHTML = '';
    for(let r=0;r<ROWS;r++){ const row = document.createElement('div'); row.className = 'rowg'; for(let c=0;c<COLS;c++){ const t = document.createElement('div'); t.className = 'tile'; row.appendChild(t); } g.appendChild(row); }
  }
  function score(guess){
    const res = Array(COLS).fill('no'), rest = {};
    for(let i=0;i<COLS;i++){ if(guess[i]===answer[i]) res[i] = 'ok'; else rest[answer[i]] = (rest[answer[i]]||0)+1; }
    for(let i=0;i<COLS;i++){ if(res[i]==='ok') continue; const ch = guess[i]; if(rest[ch]>0){ res[i] = 'mid'; rest[ch]--; } }
    return res;
  }
  function paintRow(r, res){
    const row = $('grid').children[r], word = guesses[r];
    for(let c=0;c<COLS;c++){ const t = row.children[c]; t.textContent = word[c]; t.className = 'tile f '+(res?res[c]:''); }
  }
  function paintAll(){
    for(let r=0;r<ROWS;r++){
      const row = $('grid').children[r];
      for(let c=0;c<COLS;c++){ const t = row.children[c]; t.textContent=''; t.className='tile'; }
    }
    guesses.forEach((w,r)=>paintRow(r, score(w)));
    paintCur(); paintKeys();
  }
  function paintCur(){
    if(done || guesses.length>=ROWS) return; const row = $('grid').children[guesses.length];
    for(let c=0;c<COLS;c++){ const t = row.children[c]; t.textContent = cur[c]||''; t.className = 'tile'+(cur[c]?' f':''); }
  }
  const LAYOUT = ['qwertyuiop','asdfghjkl','⏎zxcvbnm⌫'];
  function buildKb(){
    const kb = $('kb'); kb.innerHTML = '';
    LAYOUT.forEach(r=>{ const row = document.createElement('div'); row.className = 'kr';
      [...r].forEach(ch=>{ const b = document.createElement('button'); b.className = 'k'+(ch==='⏎'||ch==='⌫'?' w':''); b.dataset.k = ch; b.textContent = ch==='⏎'?'Enter':ch; b.onclick = ()=>press(ch); row.appendChild(b); });
      kb.appendChild(row); });
  }
  function paintKeys(){
    const best = {}; const rank = {no:1,mid:2,ok:3};
    guesses.forEach(w=>{ const res = score(w); [...w].forEach((ch,i)=>{ if(!best[ch] || rank[res[i]]>rank[best[ch]]) best[ch] = res[i]; }); });
    document.querySelectorAll('.k').forEach(b=>{ const k = b.dataset.k; b.classList.remove('ok','mid','no'); if(best[k]) b.classList.add(best[k]); });
  }
  function toast(t){ $('hint').textContent = t; clearTimeout(toast.t); toast.t = setTimeout(()=>{ $('hint').textContent = mode==='daily' ? 'Daily puzzle' : 'Practice — random word'; if(!done && guesses.length>=3 && ANSWERS[answer]) $('hint').textContent = 'Hint: it is '+ANSWERS[answer]; },1600); }

  /* ---------- input ---------- */
  function press(k){
    if(done || busy) return;
    if(k==='⌫'||k==='Backspace'){ cur = cur.slice(0,-1); paintCur(); return; }
    if(k==='⏎'||k==='Enter'){ submit(); return; }
    if(/^[a-z]$/i.test(k) && cur.length<COLS){ cur += k.toLowerCase(); paintCur(); const t = $('grid').children[guesses.length].children[cur.length-1]; t.classList.add('pop'); setTimeout(()=>t.classList.remove('pop'),110); }
  }
  window.addEventListener('keydown',e=>{ if(e.ctrlKey||e.metaKey||e.altKey) return; if($('modal').classList.contains('show')) return; press(e.key); });
  function submit(){
    if(cur.length<COLS){ shake(); toast('Not enough letters'); return; }
    if(!VALID.has(cur) && !ANSWERS[cur]){ shake(); toast('Not in word list'); return; }
    busy = true; const r = guesses.length; guesses.push(cur); const res = score(cur); const row = $('grid').children[r];
    for(let c=0;c<COLS;c++){ const t = row.children[c]; t.textContent = cur[c]; setTimeout(()=>{ t.classList.add('flip'); setTimeout(()=>{ t.className = 'tile f flip '+res[c]; },250); }, c*220); }
    const g = cur; cur = '';
    setTimeout(()=>{
      busy = false; paintKeys();
      if(g===answer){ done = true; won = true; save(); record(true); setTimeout(()=>showStats(true),500); }
      else if(guesses.length>=ROWS){ done = true; won = false; save(); record(false); setTimeout(()=>showStats(true),500); }
      else { save(); if(guesses.length>=3 && ANSWERS[answer]) $('hint').textContent = 'Hint: it is '+ANSWERS[answer]; }
    }, COLS*220+400);
  }
  function shake(){ const row = $('grid').children[guesses.length]; if(!row) return; row.classList.remove('shake'); void row.offsetWidth; row.classList.add('shake'); }

  /* ---------- stats / share ---------- */
  function record(w){
    if(mode!=='daily') return;
    if(stats.last===dateStr) return;            // count each day once
    stats.played++; stats.last = dateStr;
    if(w){ stats.won++; stats.streak++; stats.max = Math.max(stats.max,stats.streak); stats.dist[guesses.length-1]++; } else stats.streak = 0;
    LS.set('tw_stats',stats);
  }
  function shareText(){
    const rows = guesses.map(g=>score(g).map(x=>x==='ok'?'🟩':x==='mid'?'🟨':'⬛').join('')).join('\n');
    return 'Tea Words '+(mode==='daily'?dateStr:'(practice)')+' '+(won?guesses.length:'X')+'/6\n'+rows+'\n'+location.href.split('#')[0];
  }
  function showStats(end){
    const c = $('card'); const mx = Math.max(1,...stats.dist);
    let h = '<h2>'+(end ? (won ? '🎉 Well done!' : 'The word was “'+answer.toUpperCase()+'”') : 'Statistics')+'</h2>';
    if(end && won) h += '<div class="sub">You found it in '+guesses.length+' '+(guesses.length===1?'try':'tries')+'.</div>';
    if(end && !won) h += '<div class="sub">'+(ANSWERS[answer]?'It is '+ANSWERS[answer]+'. ':'')+'Come back tomorrow for a new one!</div>';
    h += '<div class="stats"><div><b>'+stats.played+'</b><span>Played</span></div><div><b>'+(stats.played?Math.round(100*stats.won/stats.played):0)+'%</b><span>Win rate</span></div><div><b>'+stats.streak+'</b><span>Streak</span></div><div><b>'+stats.max+'</b><span>Best streak</span></div></div>';
    stats.dist.forEach((n,i)=>{ h += '<div class="bar">'+(i+1)+'<i style="width:'+Math.max(8,Math.round(n/mx*100))+'%">'+n+'</i></div>'; });
    h += '<div class="row">';
    if(done) h += '<button class="btn" id="shareBtn">📤 Share</button>';
    h += '<button class="btn alt" id="practiceBtn">🎲 Practice</button><button class="btn alt" id="closeBtn">Close</button></div><div class="row" id="extra"></div>';
    c.innerHTML = h; $('modal').classList.add('show');
    $('closeBtn').onclick = ()=>$('modal').classList.remove('show');
    $('practiceBtn').onclick = ()=>{ mode = 'random'; LS.set('tw_mode',mode); $('modal').classList.remove('show'); newRound(); };
    if($('shareBtn')) $('shareBtn').onclick = async ()=>{
      const t = shareText();
      try{ if(navigator.share){ await navigator.share({text:t}); return; } }catch(e){ if(e && e.name==='AbortError') return; }
      try{ await navigator.clipboard.writeText(t); $('shareBtn').textContent = '✅ Copied!'; }catch(e){ prompt('Copy your result:',t); }
    };
    const tip = window.TeaSupport && TeaSupport.button('btn alt'); if(tip) $('extra').appendChild(tip);
  }
  function showHelp(){
    $('card').innerHTML = '<div class="help"><h2>How to play</h2><div class="sub">Guess the food word in 6 tries. Every guess must be a real 5-letter word.</div>'+
      '<div class="ex"><div class="tile f ok">R</div><div class="tile f">I</div><div class="tile f">C</div><div class="tile f">E</div><div class="tile f">S</div></div><div class="sub"><b>Green</b>: right letter, right spot.</div>'+
      '<div class="ex"><div class="tile f">M</div><div class="tile f mid">A</div><div class="tile f">N</div><div class="tile f">G</div><div class="tile f">O</div></div><div class="sub"><b>Amber</b>: in the word, wrong spot.</div>'+
      '<div class="ex"><div class="tile f">S</div><div class="tile f">O</div><div class="tile f no">U</div><div class="tile f">P</div><div class="tile f">S</div></div><div class="sub"><b>Grey</b>: not in the word.</div>'+
      '<div class="sub">After 3 guesses you get a hint about the kind of word. A new Daily puzzle appears every day, the same for everyone.</div>'+
      '<div class="row"><button class="btn" id="closeBtn">Got it</button></div></div>';
    $('modal').classList.add('show'); $('closeBtn').onclick = ()=>{ $('modal').classList.remove('show'); LS.set('tw_seen',1); };
  }
  $('helpBtn').onclick = showHelp; $('statBtn').onclick = ()=>showStats(false);
  $('modeBtn').onclick = ()=>{ mode = mode==='daily' ? 'random' : 'daily'; LS.set('tw_mode',mode); newRound(); toast(mode==='daily'?'Daily puzzle':'Practice — random word'); };

  buildKb(); newRound(); if(!LS.get('tw_seen',0)) showHelp();
  window.__tw = { answer:()=>answer, guesses:()=>guesses, get done(){return done;}, get won(){return won;}, press, submit, mode:()=>mode, dailyWord, valid:w=>VALID.has(w)||!!ANSWERS[w], count:()=>ANS.length, setMode:m=>{mode=m;newRound();} };
})();
</script>
<script>if("serviceWorker" in navigator && location.protocol.indexOf("http")===0)window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});</script>
