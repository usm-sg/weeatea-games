.btn.alt{background:linear-gradient(#7d86ff,#4a4fd6);color:#fff;box-shadow:0 6px 0 #26288e,0 10px 18px rgba(0,0,0,.35);text-shadow:0 2px 0 #0004;font-size:16px;padding:11px 22px}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b35a0a}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.demo{display:flex;gap:8px;margin:2px 0 4px}

.demo i:nth-child(2){animation-delay:.12s}.demo i:nth-child(3){animation-delay:.24s}.demo i:nth-child(4){animation-delay:.36s}.demo i:nth-child(5){animation-delay:.48s}
@keyframes hop{0%,100%{transform:translateY(0) scale(1,1)}40%{transform:translateY(-12px) scale(.94,1.08)}60%{transform:translateY(0) scale(1.1,.9)}}
.how{background:#ffffff14;border:1px solid #ffffff33;border-radius:14px;padding:8px 12px;font-size:12.5px;line-height:1.55;color:#efe6ff;text-align:left;max-width:340px}
.how b{color:var(--gold)}

<script>
/* Tea Games photo sprites — shared by every game and by the Photo Studio.
   Reads 12 photo slots from this browser (IndexedDB), or from a teapack.json file
   placed next to the games (use that one when bundling the games into a store app).
   Any slot with no photo falls back to the normal emoji, so the games never break. */
(function(){
  var DB = 'tea-sprites', STORE = 'pack', N = 12;
  var imgs = {}, maps = {}, cbs = [], isReady = false;
  var S = window.TeaSprites = {
    N: N,
    ready: false,
    map: function(o){ for(var k in o) maps[k] = o[k]; },
    img: function(slot){ return imgs[slot] || null; },
    forEmoji: function(e){ var i = maps[e]; return (i == null) ? null : (imgs[i] || null); },
    onReady: function(cb){ if(isReady) cb(); else cbs.push(cb); }
  };
  function done(){ isReady = true; S.ready = true; var a = cbs; cbs = []; a.forEach(function(f){ try{ f(); }catch(e){} }); }

  function openDB(){
    return new Promise(function(res, rej){
      if(!window.indexedDB) return rej(new Error('no idb'));
      var r = indexedDB.open(DB, 1);
      r.onupgradeneeded = function(){ r.result.createObjectStore(STORE, { keyPath: 'id' }); };
      r.onsuccess = function(){ res(r.result); };
      r.onerror = function(){ rej(r.error); };
    });
  }
  function readAll(){
    return openDB().then(function(db){
      return new Promise(function(res, rej){
        var q = db.transaction(STORE).objectStore(STORE).getAll();
        q.onsuccess = function(){ res(q.result || []); };
        q.onerror = function(){ rej(q.error); };
      });
    });
  }
  function fromPack(){
    /* optional bundled file; the service worker keeps a copy so it also works offline */
    return fetch('teapack.json').then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){ return (j && j.slots) ? j.slots.map(function(s){ return { id: s.id, data: s.data }; }) : []; })
      .catch(function(){ return []; });
  }
  function load(item){
    return new Promise(function(res){
      if(!item || !item.data) return res();
      var im = new Image();
      im.onload = function(){ imgs[item.id] = im; res(); };
      im.onerror = function(){ res(); };
      im.src = item.data;
    });
  }
  Promise.all([ readAll().catch(function(){ return []; }), fromPack() ]).then(function(r){
    var byId = {};
    r[1].forEach(function(x){ byId[x.id] = x; });   /* bundled pack first … */
    r[0].forEach(function(x){ byId[x.id] = x; });   /* … the player's own photos win */
    return Promise.all(Object.keys(byId).map(function(k){ return load(byId[k]); }));
  }).then(done, done);
})();

</script>
<script>window.TEA_LB_API = 'https://tea-leaderboard.usoemoe.workers.dev'; window.TEA_LB_GAME = 'tea-match';</script>
<!--LB-WIDGET--><script>
/* Tea Games leaderboard widget — shared by every game.
   Needs window.TEA_LB_API (Worker URL) and window.TEA_LB_GAME set before this runs.
   With no API URL it does nothing, so games work fine without a backend. */
(function(){
  var API = String(window.TEA_LB_API || '').replace(/\/+$/, '');
  var GAME = String(window.TEA_LB_GAME || '');
  var enabled = !!API && !!GAME;
  var T = window.TeaLB = { enabled: enabled, submit: function(){}, open: function(){} };
  if(!enabled) return;

  var PID_KEY = 'tealb_pid', NAME_KEY = 'tealb_name';
  function lsGet(k){ try{ return localStorage.getItem(k) || ''; }catch(e){ return ''; } }
  function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
  var pid = lsGet(PID_KEY);
  if(!pid){
    pid = (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
        : (Date.now().toString(36) + Math.random().toString(36).slice(2, 12) + Math.random().toString(36).slice(2, 8));
    lsSet(PID_KEY, pid);
  }

  /* ---------- offline queue: scores played with no signal are sent later ---------- */
  var Q_KEY = 'tealb_queue';
  function qGet(){ try{ var a = JSON.parse(lsGet(Q_KEY) || '[]'); return Array.isArray(a) ? a : []; }catch(e){ return []; } }
  function qPut(a){ lsSet(Q_KEY, JSON.stringify(a.slice(-30))); }
  function qAdd(item){
    var a = qGet(); a.push(item);
    /* keep only the best 3 per game so a long offline session can't flood the server */
    var by = {}; a.forEach(function(x){ (by[x.game] = by[x.game] || []).push(x); });
    var out = []; Object.keys(by).forEach(function(g){ by[g].sort(function(x, y){ return y.score - x.score; }); out = out.concat(by[g].slice(0, 3)); });
    qPut(out);
  }
  var flushing = false;
  function flushQueue(){
    if(flushing) return; var a = qGet(); if(!a.length) return;
    flushing = true;
    var keep = [];
    (function next(i){
      if(i >= a.length){ qPut(keep); flushing = false; return; }
      var it = a[i];
      fetch(API + '/api/score', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ game: it.game, pid: pid, name: it.name, score: it.score, secs: it.secs }) })
      .then(function(){ next(i + 1); })          /* accepted or rejected by the server: either way, done with it */
      .catch(function(){ keep = keep.concat(a.slice(i)); qPut(keep); flushing = false; });  /* still offline: try again later */
    })(0);
  }
  window.addEventListener('online', flushQueue);
  setTimeout(flushQueue, 1500);

  var css = '\
.tlb-back{position:fixed;inset:0;z-index:99999;display:none;align-items:center;justify-content:center;padding:14px;background:rgba(5,8,18,.8);font-family:"Segoe UI",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}\
.tlb-back.show{display:flex}\
.tlb-card{width:min(94vw,440px);max-height:92vh;overflow:auto;background:linear-gradient(160deg,#25335e,#161d3a);border:2px solid #ffcf4d;border-radius:18px;padding:18px 16px 16px;color:#e8eefc;box-shadow:0 0 50px rgba(255,207,77,.25);text-align:center}\
.tlb-card *{box-sizing:border-box;user-select:text}\
.tlb-title{font-size:20px;font-weight:900;color:#ffcf4d;margin-bottom:4px}\
.tlb-sub{font-size:12px;color:#9fb0d8;margin-bottom:10px;letter-spacing:1px}\
.tlb-score{font-size:36px;font-weight:900;color:#fff;margin:2px 0 10px}\
.tlb-in{width:100%;padding:11px 12px;border-radius:10px;border:1px solid rgba(255,255,255,.2);background:#0f1630;color:#fff;font-size:16px;text-align:center;outline:none}\
.tlb-in:focus{border-color:#ffcf4d}\
.tlb-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}\
.tlb-btn{background:linear-gradient(#ffae52,#e8722a);color:#fff;border:none;font-weight:800;font-size:14px;padding:10px 20px;border-radius:22px;cursor:pointer;box-shadow:0 4px 0 #a84e14}\
.tlb-btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a84e14}\
.tlb-btn.alt{background:linear-gradient(#6b7bb0,#46557f);box-shadow:0 4px 0 #2a3558}\
.tlb-btn:disabled{opacity:.5}\
.tlb-msg{min-height:20px;margin-top:10px;font-size:13px;color:#9fb0d8}\
.tlb-msg.err{color:#ff8a8a}\
.tlb-ranks{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0 2px}\
.tlb-rank{background:rgba(255,255,255,.08);border-radius:12px;padding:8px 12px;min-width:92px}\
.tlb-rank b{display:block;font-size:22px;color:#ffcf4d}\
.tlb-rank span{font-size:11px;color:#9fb0d8}\
.tlb-tabs{display:flex;gap:6px;justify-content:center;margin:8px 0}\
.tlb-tab{flex:1;background:rgba(255,255,255,.08);color:#c9d3ea;border:none;border-radius:16px;padding:7px 4px;font-size:13px;font-weight:700;cursor:pointer}\
.tlb-tab.on{background:#ffcf4d;color:#1a1a2e}\
.tlb-list{margin:8px 0 0;text-align:left}\
.tlb-li{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:10px;font-size:14px}\
.tlb-li:nth-child(odd){background:rgba(255,255,255,.04)}\
.tlb-li.me{background:rgba(255,207,77,.2);outline:1px solid #ffcf4d}\
.tlb-r{width:34px;text-align:center;font-weight:900;color:#9fb0d8}\
.tlb-li:nth-child(1) .tlb-r{color:#ffd54d;font-size:17px}.tlb-li:nth-child(2) .tlb-r{color:#d8dde8;font-size:16px}.tlb-li:nth-child(3) .tlb-r{color:#e0955a;font-size:16px}\
.tlb-n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\
.tlb-c{font-size:11px;color:#9fb0d8;white-space:nowrap}\
.tlb-s{font-weight:800;color:#ffcf4d;font-variant-numeric:tabular-nums}\
.tlb-gap{text-align:center;color:#6f7fa8;font-size:12px;padding:2px}\
.tlb-empty{padding:18px 8px;color:#9fb0d8;font-size:13px;text-align:center}';
  var st = document.createElement('style'); st.textContent = css; document.head.appendChild(st);

  var back = document.createElement('div'); back.className = 'tlb-back';
  var card = document.createElement('div'); card.className = 'tlb-card';
  back.appendChild(card); document.body.appendChild(back);
  // keep typing in the box from triggering game controls
  ['keydown','keyup','keypress'].forEach(function(ev){ back.addEventListener(ev, function(e){ if(e.key !== 'Escape') e.stopPropagation(); }); });
  back.addEventListener('click', function(e){ if(e.target === back) close(); });
  window.addEventListener('keydown', function(e){ if(e.key === 'Escape' && back.classList.contains('show')) close(); });

  function close(){ back.classList.remove('show'); }
  function show(){ back.classList.add('show'); }
  function el(tag, cls, text){ var n = document.createElement(tag); if(cls) n.className = cls; if(text != null) n.textContent = text; return n; }
  function fmt(n){ try{ return Number(n).toLocaleString(); }catch(e){ return String(n); } }
  function flag(cc){
    if(!cc || cc === 'XX' || cc.length !== 2) return '🌐';
    try{ return String.fromCodePoint(0x1F1E6 + cc.charCodeAt(0) - 65, 0x1F1E6 + cc.charCodeAt(1) - 65); }catch(e){ return ''; }
  }

  var myCountry = '', period = 'all', onlyMine = false;

  /* ---------- leaderboard view ---------- */
  function openBoard(startPeriod){
    if(startPeriod) period = startPeriod;
    renderBoard(); show(); loadBoard();
  }
  var listBox, scopeBtn;
  function renderBoard(){
    card.innerHTML = '';
    card.appendChild(el('div', 'tlb-title', '🏆 Leaderboard'));
    card.appendChild(el('div', 'tlb-sub', 'BEST SCORE PER PLAYER'));
    var tabs = el('div', 'tlb-tabs');
    [['day','Today'],['week','This week'],['all','All-time']].forEach(function(p){
      var b = el('button', 'tlb-tab' + (period === p[0] ? ' on' : ''), p[1]);
      b.onclick = function(){ period = p[0]; renderBoard(); loadBoard(); };
      tabs.appendChild(b);
    });
    card.appendChild(tabs);
    var sc = el('div', 'tlb-tabs');
    var w = el('button', 'tlb-tab' + (!onlyMine ? ' on' : ''), '🌍 World');
    w.onclick = function(){ onlyMine = false; renderBoard(); loadBoard(); };
    scopeBtn = el('button', 'tlb-tab' + (onlyMine ? ' on' : ''), (myCountry ? flag(myCountry) + ' ' + myCountry : '📍 My country'));
    scopeBtn.onclick = function(){ onlyMine = true; renderBoard(); loadBoard(); };
    sc.appendChild(w); sc.appendChild(scopeBtn); card.appendChild(sc);
    listBox = el('div', 'tlb-list'); listBox.appendChild(el('div', 'tlb-empty', 'Loading…'));
    card.appendChild(listBox);
    var row = el('div', 'tlb-row'); var cb = el('button', 'tlb-btn alt', 'Close'); cb.onclick = close; row.appendChild(cb); card.appendChild(row);
  }
  var reqSeq = 0;
  function loadBoard(){
    var my = ++reqSeq;
    var q = 'game=' + encodeURIComponent(GAME) + '&period=' + period + '&limit=25&pid=' + encodeURIComponent(pid);
    if(onlyMine && myCountry) q += '&country=' + myCountry;
    var ckey = 'tealb_cache_' + GAME + '_' + period + '_' + (onlyMine ? 'c' : 'w');
    function drawEntries(d, stale){
      if(my !== reqSeq) return;
      if(d.you_country && !myCountry){
        myCountry = d.you_country;
        if(scopeBtn && myCountry !== 'XX') scopeBtn.textContent = flag(myCountry) + ' ' + myCountry;
      }
      listBox.innerHTML = '';
      if(stale) listBox.appendChild(el('div', 'tlb-empty', 'Offline — showing the last saved board.'));
      if(!d.entries.length){ listBox.appendChild(el('div', 'tlb-empty', 'No scores here yet — be the first!')); return; }
      var inList = false;
      d.entries.forEach(function(e){
        if(e.me) inList = true;
        var li = el('div', 'tlb-li' + (e.me ? ' me' : ''));
        li.appendChild(el('div', 'tlb-r', '#' + e.rank));
        li.appendChild(el('div', 'tlb-n', e.name));
        li.appendChild(el('div', 'tlb-c', flag(e.country) + ' ' + (e.country === 'XX' ? '' : e.country)));
        li.appendChild(el('div', 'tlb-s', fmt(e.score)));
        listBox.appendChild(li);
      });
      if(d.me && !inList){
        listBox.appendChild(el('div', 'tlb-gap', '• • •'));
        var li2 = el('div', 'tlb-li me');
        li2.appendChild(el('div', 'tlb-r', '#' + d.me.rank));
        li2.appendChild(el('div', 'tlb-n', 'You'));
        li2.appendChild(el('div', 'tlb-c', ''));
        li2.appendChild(el('div', 'tlb-s', fmt(d.me.score)));
        listBox.appendChild(li2);
      }
    }
    fetch(API + '/api/top?' + q).then(function(r){ return r.json(); }).then(function(d){
      if(my !== reqSeq) return;
      if(d.error) throw new Error(d.error);
      lsSet(ckey, JSON.stringify(d));
      drawEntries(d, false);
    }).catch(function(){
      if(my !== reqSeq) return;
      var c = null; try{ c = JSON.parse(lsGet(ckey) || 'null'); }catch(e){}
      if(c && c.entries){ drawEntries(c, true); return; }
      listBox.innerHTML = '';
      var m = el('div', 'tlb-empty', "Couldn't reach the leaderboard. Check your connection."); listBox.appendChild(m);
    });
  }

  /* ---------- submit view ---------- */
  function submitScore(score, secs){
    score = Math.floor(Number(score)); secs = Number(secs);
    if(!(score > 0)) return;
    card.innerHTML = '';
    card.appendChild(el('div', 'tlb-title', '🏆 Submit your score'));
    card.appendChild(el('div', 'tlb-sub', 'JOIN THE WORLD RANKING'));
    card.appendChild(el('div', 'tlb-score', fmt(score)));
    var inp = el('input', 'tlb-in'); inp.type = 'text'; inp.maxLength = 16; inp.placeholder = 'Your nickname';
    inp.value = lsGet(NAME_KEY); inp.setAttribute('autocomplete', 'nickname'); inp.setAttribute('enterkeyhint', 'send');
    card.appendChild(inp);
    var msg = el('div', 'tlb-msg', 'Only your nickname, score and country are stored.');
    card.appendChild(msg);
    var row = el('div', 'tlb-row');
    var ok = el('button', 'tlb-btn', 'Submit'); var skip = el('button', 'tlb-btn alt', 'Skip');
    row.appendChild(ok); row.appendChild(skip); card.appendChild(row);
    skip.onclick = close;
    function go(){
      var name = inp.value.trim();
      if(!name){ msg.className = 'tlb-msg err'; msg.textContent = 'Please type a nickname.'; inp.focus(); return; }
      lsSet(NAME_KEY, name);
      ok.disabled = true; msg.className = 'tlb-msg'; msg.textContent = 'Sending…';
      fetch(API + '/api/score', { method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ game: GAME, pid: pid, name: name, score: score, secs: secs }) })
      .then(function(r){ return r.json().then(function(d){ return { ok: r.ok, d: d }; }); })
      .then(function(res){
        if(!res.ok) throw new Error(res.d && res.d.error || 'error');
        myCountry = res.d.country || myCountry; showResult(res.d, score);
      }).catch(function(err){
        var m = String(err && err.message || '');
        /* a failed fetch() is a TypeError; replies from the server arrive as plain Errors */
        if(navigator.onLine === false || err instanceof TypeError){
          qAdd({ game: GAME, name: name, score: score, secs: secs, t: Date.now() });
          card.innerHTML = '';

    for(let c=0;c<N;c++){
      let write = N-1;
      for(let r=N-1;r>=0;r--){ if(grid[r][c]){ if(r!==write){ grid[write][c] = grid[r][c]; grid[r][c] = null; falls.push([grid[write][c],write]); } write--; } }
      for(let r=write;r>=0;r--){ const t = mk(rnd(FOODS.length), r, c); t.y = r-(write+1)-0.4-Math.random()*.4; grid[r][c] = t; falls.push([t,r]); }
    }
    const starts = falls.map(([t])=>t.y);
    await tween(430,k=>{ falls.forEach(([t,r],i)=>{ t.y = starts[i]+(r-starts[i])*k; }); },bounce);
    falls.forEach(([t,r])=>{ t.y = r; t.sq = 1; });
  }
  async function resolve(first){
    let chain = 0;
    for(;;){
      const g = first || findMatchGroups(null); first = null;
      if(!g.clear.size && !g.spawns.length) break;
      chain++; await clearGroup(g,chain);
    }
    return chain;
  }

  async function attempt(a,b){
    if(busy||state!=='playing') return;
    busy = true; sel = null; hint = null; ac();
    const A0 = grid[a.r][a.c], B0 = grid[b.r][b.c];
    let first = null, special = false;
    if(A0.sp==='c' || B0.sp==='c'){
      const bomb = A0.sp==='c' ? A0 : B0, other = bomb===A0 ? B0 : A0;
      bomb.target = (other.sp==='c') ? -9 : other.t; special = true;
    }
    // slide the two candies past each other
    sfx.swap();
    swapData(a,b);
    const A = grid[a.r][a.c], B = grid[b.r][b.c], A0p = {x:A.x,y:A.y}, B0p = {x:B.x,y:B.y};
    await tween(150,k=>{ A.x=A0p.x+(a.c-A0p.x)*k; A.y=A0p.y+(a.r-A0p.y)*k; B.x=B0p.x+(b.c-B0p.x)*k; B.y=B0p.y+(b.r-B0p.y)*k; });
    if(special){
      const clear = new Set(); const bombCell = A.sp==='c'?a:b;
      clear.add(key(bombCell.r,bombCell.c));
      const act = expand(clear); first = {clear, spawns:[], activated:act};
    } else if(A.sp && B.sp){
      const clear = new Set([key(a.r,a.c),key(b.r,b.c)]); const act = expand(clear); first = {clear, spawns:[], activated:act}; special = true;
    } else {
      const m = findMatchGroups([a,b]);
      if(m.clear.size || m.spawns.length) first = m;
    }
    if(!first){
      swapData(a,b);
      const A1 = grid[a.r][a.c], B1 = grid[b.r][b.c], p = {x:A1.x,y:A1.y}, q = {x:B1.x,y:B1.y};
      sfx.bad();
      await tween(150,k=>{ A1.x=p.x+(a.c-p.x)*k; A1.y=p.y+(a.r-p.y)*k; B1.x=q.x+(b.c-q.x)*k; B1.y=q.y+(b.r-q.y)*k; });
      msg('That swap makes no match — try another');
    } else {
      msg('');
      await resolve(first);
      if(!findMoves().length){ msg('No moves left — shuffling!'); await shuffleBoard(); }
    }
    idleAt = performance.now(); busy = false;
    if(timeLeft<=0 && state==='playing') endGame();
  }
  async function shuffleBoard(){
    const all = []; for(let r=0;r<N;r++) for(let c=0;c<N;c++) all.push(grid[r][c]);
    let tries = 0;
    do{ for(let i=all.length-1;i>0;i--){ const j = rnd(i+1); [all[i],all[j]] = [all[j],all[i]]; }
      let i = 0; for(let r=0;r<N;r++) for(let c=0;c<N;c++) grid[r][c] = all[i++];
    }while((findMatchGroups(null).clear.size || !findMoves().length) && ++tries<200);
    const st = []; for(let r=0;r<N;r++) for(let c=0;c<N;c++){ const g = grid[r][c]; st.push([g,g.x,g.y,r,c]); }
    await tween(420,k=>{ st.forEach(([g,x,y,r,c])=>{ g.x=x+(c-x)*k; g.y=y+(r-y)*k; g.rot = Math.sin(k*Math.PI)*.4; }); });
    st.forEach(([g])=>{ g.rot = 0; });
  }
  function msg(t){ $('msg').textContent = t; }

  /* ---------- input ---------- */
  let down = null;
  function cellAt(e){ const R = cv.getBoundingClientRect(); const c = Math.floor((e.clientX-R.left)/R.width*N), r = Math.floor((e.clientY-R.top)/R.height*N); return (r>=0&&r<N&&c>=0&&c<N)?{r,c}:null; }
  const adj = (a,b)=>Math.abs(a.r-b.r)+Math.abs(a.c-b.c)===1;
  cv.addEventListener('pointerdown',e=>{
    ac(); if(busy||state!=='playing') return; const p = cellAt(e); if(!p) return;
    cv.setPointerCapture(e.pointerId); down = {p, x:e.clientX, y:e.clientY, done:false}; hint = null;
    if(sel && adj(sel,p)){ const s = sel; down.done = true; attempt(s,p); } else sel = p;
  });
  cv.addEventListener('pointermove',e=>{
    if(!down||down.done||busy) return;
    const dx = e.clientX-down.x, dy = e.clientY-down.y;
    if(Math.max(Math.abs(dx),Math.abs(dy))>cell*0.3){
      const d = Math.abs(dx)>Math.abs(dy) ? {r:0,c:Math.sign(dx)} : {r:Math.sign(dy),c:0};
      const q = {r:down.p.r+d.r,c:down.p.c+d.c}; down.done = true;
      if(q.r>=0&&q.r<N&&q.c>=0&&q.c<N) attempt(down.p,q);
    }
  });
  const up = ()=>{ down = null; };
  cv.addEventListener('pointerup',up); cv.addEventListener('pointercancel',up);

  /* ---------- drawing ---------- */
  function star(g,x,y,r,rot){ g.beginPath(); for(let i=0;i<8;i++){ const a = rot+i*Math.PI/4, rr = i%2?r*.38:r; g.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr); } g.closePath(); }
  function draw(now){
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,size,size);
    let ox = 0, oy = 0; if(shake>0.3){ ox = (Math.random()-.5)*shake; oy = (Math.random()-.5)*shake; shake *= 0.88; } else shake = 0;
    ctx.save(); ctx.translate(ox,oy);
    // board tiles: soft rounded squares
    for(let r=0;r<N;r++) for(let c=0;c<N;c++){
      ctx.fillStyle = (r+c)%2 ? 'rgba(255,255,255,.14)' : 'rgba(255,255,255,.07)';
      const m = 1.5; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(c*cell+m,r*cell+m,cell-2*m,cell-2*m,cell*.18) : ctx.rect(c*cell+m,r*cell+m,cell-2*m,cell-2*m); ctx.fill();
    }
    if(grid){
      const pulse = 1+Math.sin(now/130)*0.07;
      const order = []; for(let r=0;r<N;r++) for(let c=0;c<N;c++) if(grid[r][c]) order.push(grid[r][c]);
      for(const t of order){
        const x = (t.x+.5)*cell, y = (t.y+.5)*cell;
        const isSel = sel && grid[sel.r] && grid[sel.r][sel.c]===t;
        const isHint = hint && (grid[hint[0].r][hint[0].c]===t || grid[hint[1].r][hint[1].c]===t);
        if(isSel || isHint){ ctx.save(); ctx.globalAlpha = isSel?.9:(.5+.3*Math.sin(now/140)); ctx.fillStyle = isSel?'#fff7b0':'#ffffff'; ctx.shadowColor = '#ffe066'; ctx.shadowBlur = cell*.5; ctx.beginPath(); ctx.arc(x,y,cell*.5,0,6.283); ctx.fill(); ctx.restore(); }
        // squash & stretch after landing
        let sx = t.s, sy = t.s;
        if(t.sq>0.02){ const w = Math.sin(t.sq*Math.PI*2.2)*0.16*t.sq; sx *= 1+w; sy *= 1-w; t.sq *= 0.9; } else t.sq = 0;
        if(isSel){ sx *= 1.1; sy *= 1.1; } if(isHint){ sx *= pulse; sy *= pulse; }
        ctx.save(); ctx.globalAlpha = Math.max(0,t.a); ctx.translate(x,y); if(t.rot) ctx.rotate(t.rot); ctx.scale(sx,sy);
        ctx.drawImage(sprite(t.t,t.sp),-cell/2,-cell/2,cell,cell); ctx.restore();
        if(t.sp){ // twinkle on special candies
          const k = (Math.sin(now/220+t.x*3+t.y*5)+1)/2; ctx.save(); ctx.globalAlpha = .35+.5*k; ctx.fillStyle = '#fff'; star(ctx,x+cell*.22,y-cell*.22,cell*.13*(.6+k),now/900); ctx.fill(); ctx.restore();
        }
      }
    }
    // effects
    for(let i=effects.length-1;i>=0;i--){
      const e = effects[i]; e.life++; const k = e.life/e.max; if(k>=1){ effects.splice(i,1); continue; }
      if(e.k==='spark'){ e.x+=e.vx; e.y+=e.vy; e.vy+=.17; e.rot+=e.vr; ctx.globalAlpha = 1-k; ctx.fillStyle = e.color; star(ctx,e.x,e.y,e.r*(1-k*.4),e.rot); ctx.fill(); }
      else if(e.k==='ring'){ ctx.globalAlpha = 1-k; ctx.strokeStyle = e.color; ctx.lineWidth = cell*.16*(1-k); ctx.beginPath(); ctx.arc(e.x,e.y,e.maxR*k,0,6.283); ctx.stroke(); }
      else if(e.k==='beam'){ ctx.globalAlpha = (1-k)*.95; ctx.strokeStyle = e.color; ctx.lineCap='round'; ctx.shadowColor = e.color; ctx.shadowBlur = 18; ctx.lineWidth = e.w*(1-k*.7); ctx.beginPath(); ctx.moveTo(e.x1,e.y1); ctx.lineTo(e.x2,e.y2); ctx.stroke(); ctx.shadowBlur = 0; }
      else if(e.k==='text'){
        const rise = e.big ? 0 : e.life*0.9, sc = e.big ? (k<.18? .4+k/.18*.9 : 1.3-(k-.18)*.15) : 1;
        ctx.globalAlpha = k>.7 ? (1-k)/.3 : 1; ctx.save(); ctx.translate(e.x,e.y-rise); ctx.scale(sc,sc);
        ctx.font = '900 '+Math.round(cell*(e.big?.78:.44))+'px "Trebuchet MS",system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.lineJoin='round';
        ctx.lineWidth = cell*(e.big?.2:.12); ctx.strokeStyle = '#4a1a00'; ctx.strokeText(e.txt,0,0); ctx.fillStyle = e.color; ctx.fillText(e.txt,0,0); ctx.restore();
      }
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  /* ---------- flow ---------- */
  function loop(now){
    const dt = lastTick ? Math.min(100,now-lastTick) : 0; lastTick = now;
    if(state==='playing'){
      timeLeft -= dt/1000;
      if(timeLeft<=0){ timeLeft = 0; if(!busy) endGame(); }
      const s = Math.ceil(timeLeft); $('time').textContent = s;
      if(s<=10 && s!==lastSecond && s>0){ sfx.tick(); } lastSecond = s;
      $('fill').style.width = Math.min(100,timeLeft/90*100)+'%'; $('fill').classList.toggle('low',timeLeft<15);
      if(!busy && !hint && now-idleAt>3500){ const m = findMoves(); if(m.length) hint = m[rnd(m.length)]; }
    }
    if(shownScore<score){ shownScore += Math.max(1,Math.ceil((score-shownScore)*0.18)); if(shownScore>score) shownScore = score; $('score').textContent = shownScore; }
    try{ draw(now); }catch(e){}
    requestAnimationFrame(loop);
  }
  const STARS = [2500,6000,12000];
  function menu(){
    const o = $('overlay');
    o.innerHTML = '<h1>🍜 Tea Match</h1><div class="demo"><i style="background:radial-gradient(circle at 35% 30%,#ffd0a0,#ff8a2b 45%,#a63f00)">🍜</i><i style="background:radial-gradient(circle at 35% 30%,#fff3a0,#ffd028 45%,#a07400)">🥟</i><i style="background:radial-gradient(circle at 35% 30%,#b6ffcb,#32c862 45%,#0b6b2c)">🍵</i><i style="background:radial-gradient(circle at 35% 30%,#ffc2dc,#ff4f95 45%,#9c1450)">🍢</i><i style="background:radial-gradient(circle at 35% 30%,#ffb0b0,#f0332f 45%,#8a0c0c)">🌶️</i></div>'+
      '<div class="how"><b>Swap</b> two neighbours to line up <b>3 or more</b> of the same food.<br><b>4 in a row</b> → striped candy (clears a whole line)<br><b>5 in a row</b> → 🍵 Tea Bomb (swap it with any food to clear them all)<br><b>L or T shape</b> → blast candy (big explosion)<br>Chains earn combo words and bonus seconds. You have 90 seconds!</div>'+
      '<div class="row"><button class="btn" id="playBtn">Play</button></div><div class="row" id="extra"></div>';
    o.classList.remove('hide'); $('playBtn').onclick = startGame;
    if(window.TeaLB && TeaLB.enabled){ const b = document.createElement('button'); b.className='btn alt'; b.textContent='🏆 Ranks'; b.onclick=()=>TeaLB.open(); $('extra').appendChild(b); }
  }
  function startGame(){
    ac(); newGrid(); score = 0; shownScore = 0; timeLeft = 90; sel = null; hint = null; busy = false; effects = []; shake = 0; lastSecond = 99;
    $('score').textContent = 0; state = 'playing'; runStart = performance.now(); idleAt = performance.now() - 1500;
    $('overlay').classList.add('hide'); msg('Swap two neighbours to make a row of 3 or more');
  }
  function endGame(){
    if(state!=='playing') return; state = 'over';
    const secs = (performance.now()-runStart)/1000, sc = score; shownScore = sc; $('score').textContent = sc;
    const isBest = sc>best; if(isBest){ best = sc; try{ localStorage.setItem(BEST_KEY,best); }catch(e){} $('best').textContent = best; }
    const n = STARS.filter(x=>sc>=x).length; (n>=2?sfx.win:sfx.over)();
    const o = $('overlay');
    o.innerHTML = '<h1>⏰ Time\'s up!</h1><div class="stars">'+[0,1,2].map(i=>'<span class="'+(i<n?'':'off')+'">⭐</span>').join('')+'</div><div class="stat">'+sc+'</div><div class="sub">'+(isBest&&sc>0?'🎉 New best score!':'Best: '+best)+'</div><div class="row"><button class="btn" id="again">Play again</button></div><div class="row" id="extra"></div>';
    o.classList.remove('hide'); $('again').onclick = startGame;
    const ex = $('extra');
    if(window.TeaLB && TeaLB.enabled){
      const b = document.createElement('button'); b.className='btn alt'; b.textContent='🏆 Ranks'; b.onclick=()=>TeaLB.open(); ex.appendChild(b);
      setTimeout(()=>{ if(state==='over' && sc>0) TeaLB.submit(sc,secs); }, 700);
    }
    const tip = window.TeaSupport && TeaSupport.button('btn alt'); if(tip) ex.appendChild(tip);
  }
  $('muteBtn').onclick = ()=>{ muted = !muted; $('muteBtn').textContent = muted?'🔇':'🔊'; try{ localStorage.setItem(MUTE_KEY,muted?'1':'0'); }catch(e){} if(!muted){ ac(); sfx.swap(); } };
  if(window.TeaLB && TeaLB.enabled){ $('lbBtn').style.display=''; $('lbBtn').onclick = ()=>TeaLB.open(); }
  window.addEventListener('resize',resize); resize(); newGrid(); menu(); requestAnimationFrame(loop);

  /* test hooks */
  window.__tm = { get state(){return state;}, get score(){return score;}, get busy(){return busy;}, start:startGame, end:endGame, moves:findMoves, attempt,
    get grid(){ return grid.map(r=>r.map(g=>g&&({t:g.t,sp:g.sp}))); }, setTime:v=>{timeLeft=v;},
    setGrid(types, specials){ grid = types.map((row,r)=>row.map((t,c)=>mk(t,r,c,(specials&&specials[r+','+c])||''))); grid.forEach(row=>row.forEach(g=>{ if(g.sp==='c') g.t=-1; })); },
    find:()=>{ const m = findMatchGroups(null); return {clear:m.clear.size, spawns:m.spawns}; }, shuffle:shuffleBoard };
})();
</script>
